name: import-bootlin

# Scaffold Dockerfiles for Bootlin toolchains and open one PR with them. The
# downloads and hashing run here, not on your machine. ci.yml then builds,
# pushes, probes and records everything in that PR, in batches if needed.
# Toolchains already in the repo (same tarball URL) are skipped.

on:
  workflow_dispatch:
    inputs:
      release:
        description: Bootlin release, e.g. 2026.08-1
        required: true
      arch:
        description: Only these arch directories, space-separated (empty = all)
        required: false
        default: ""
      libc:
        description: Only these libcs, space-separated (glibc musl uclibc; empty = all)
        required: false
        default: ""
      channel:
        description: Only these channels, space-separated (stable bleeding-edge; empty = both)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: import-bootlin
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ inputs.release }}
      ARCH: ${{ inputs.arch }}
      LIBC: ${{ inputs.libc }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - name: Check inputs
        run: |
          [[ "$RELEASE" =~ ^[0-9]{4}\.[0-9]{2}-[0-9]+$ ]] || { echo "::error::release looks like 2026.08-1, got: $RELEASE"; exit 1; }
          for v in $ARCH $LIBC $CHANNEL; do
            [[ "$v" =~ ^[A-Za-z0-9._+-]+$ ]] || { echo "::error::bad filter value: $v"; exit 1; }
          done
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
      - name: Import
        run: |
          args=("$RELEASE" --jobs 8 --summary summary.md)
          # shellcheck disable=SC2206  # word splitting is intended: space-separated lists
          [ -n "$ARCH" ] && args+=(--arch $ARCH)
          # shellcheck disable=SC2206
          [ -n "$LIBC" ] && args+=(--libc $LIBC)
          # shellcheck disable=SC2206
          [ -n "$CHANNEL" ] && args+=(--channel $CHANNEL)
          python3 generator/gen.py import-bootlin "${args[@]}"
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open the PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          if [ -z "$(git status --porcelain -- toolchains)" ]; then echo "nothing new to import"; exit 0; fi
          n=$(git status --porcelain -- toolchains | wc -l)
          uid=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${uid}+${SLUG}[bot]@users.noreply.github.com"
          branch="import-bootlin/$RELEASE-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git add toolchains
          git commit -m "Import $n Bootlin $RELEASE toolchains"
          git push -u origin "$branch"
          {
            cat summary.md
            echo
            echo "CI builds, pushes, probes and records them on this PR, 200 at a time."
            echo "A toolchain that keeps failing shows up in \`ready\`; drop its directory to merge the rest."
          } > body.md
          gh pr create --head "$branch" --title "Import $n Bootlin $RELEASE toolchains" --body-file body.md
