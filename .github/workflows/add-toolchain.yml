name: add-toolchain

# "Add toolchain" issue form -> gen.py new -> PR (which ci.yml then builds,
# probes and records). Only runs for issues opened by the owner, members or
# collaborators: the PR's CI builds and publishes whatever the URL points at.

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read

concurrency:
  group: add-toolchain-${{ github.event.issue.number }}

jobs:
  scaffold:
    if: >-
      contains(github.event.issue.labels.*.name, 'add-toolchain') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
      - name: Read the issue form
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import os, re
          body = os.environ["BODY"].replace("\r\n", "\n")
          def field(label):
              m = re.search(rf"^### {re.escape(label)}\s*\n+(.*?)\s*(?=^### |\Z)", body, re.M | re.S)
              v = m.group(1).strip() if m else ""
              return "" if v == "_No response_" else v
          tc_id, url, cc = field("Toolchain id"), field("Tarball URL"), field("gcc name")
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,80}", tc_id):
              raise SystemExit(f"bad toolchain id: {tc_id!r}")
          if not re.fullmatch(r"https://[^\s'\"`$;|&<>]+", url):
              raise SystemExit(f"bad tarball URL: {url!r}")
          if cc and not re.fullmatch(r"[\w.+-]+-gcc", cc):
              raise SystemExit(f"bad gcc name: {cc!r}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"TC_ID={tc_id}\nTC_URL={url}\nTC_CC={cc}\n")
          PY
      - name: gen.py new
        id: new
        run: |
          set -o pipefail
          args=("$TC_ID" "$TC_URL")
          [ -n "$TC_CC" ] && args+=(--cc "$TC_CC")
          python3 generator/gen.py new "${args[@]}" 2>&1 | tee new.log
      - name: Open the PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          uid=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${uid}+${SLUG}[bot]@users.noreply.github.com"
          branch="add-toolchain/$TC_ID"
          git switch -c "$branch"
          git add "toolchains/$TC_ID/Dockerfile"
          git commit -m "Add toolchain $TC_ID" -m "Closes #$ISSUE"
          git push -u origin "$branch"
          {
            echo "Adds \`toolchains/$TC_ID/Dockerfile\`, generated by \`gen.py new\` from #$ISSUE."
            echo
            echo "CI builds the image, pushes it to GHCR, probes it and commits the record to this PR."
            echo
            echo '```'; grep -vE '^\s*$' new.log | tail -n 20; echo '```'
            echo
            echo "Closes #$ISSUE"
          } > pr.md
          url=$(gh pr create --title "Add toolchain $TC_ID" --body-file pr.md --head "$branch")
          gh issue comment "$ISSUE" --body "Opened $url"
      - name: Report failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          { echo "Could not scaffold this toolchain ([run]($RUN))."; echo; echo '```'; tail -n 20 new.log 2>/dev/null; echo '```'; } > c.md
          gh issue comment "$ISSUE" --body-file c.md
