name: ci

# On a PR: check everything, then build + push + probe only the toolchains whose
# records are stale (new or changed Dockerfile, or a probe change), and commit
# the new records back to the PR branch. The PR you merge therefore always
# carries data/fingerprints.json that matches its Dockerfiles.
#
# Images are content-addressed (tag = Dockerfile hash): a tag that already
# exists in GHCR is pulled, never rebuilt, so one hash maps to one digest.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Unit tests
        run: python3 -m unittest discover -s generator/tests
      - name: Lint Dockerfiles (every input pinned)
        run: python3 generator/gen.py lint
      - name: Validate dataset against the schema
        run: python3 generator/gen.py validate

  plan:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.plan.outputs.stale }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: plan
        run: |
          export TCFP_REGISTRY="ghcr.io/${GITHUB_REPOSITORY,,}"
          python3 generator/gen.py status --json > status.json
          stale=$(python3 -c 'import json; print(json.dumps(json.load(open("status.json"))["stale"]))')
          echo "stale=$stale" >> "$GITHUB_OUTPUT"
          [ "$stale" = "[]" ] && echo "any=false" >> "$GITHUB_OUTPUT" || echo "any=true" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          rows = json.load(open("status.json"))["toolchains"]
          print("### Toolchain status")
          print()
          print("| toolchain | state | image |")
          print("|---|---|---|")
          for r in rows:
              print(f"| {r['tc_id']} | {r['state']} {r['reason']} | `{r['image']}` |")
          PY

  build:
    # Only PRs from branches of this repo (the add-toolchain bot or you) may push images.
    needs: [checks, plan]
    if: >-
      needs.plan.outputs.any == 'true' && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        tc_id: ${{ fromJSON(needs.plan.outputs.stale) }}
    env:
      TC_ID: ${{ matrix.tc_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Registry name
        run: echo "TCFP_REGISTRY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (or pull if this Dockerfile hash already exists)
        run: |
          python3 generator/gen.py build "$TC_ID" --push \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.description=Cross toolchain $TC_ID, fingerprinted by toolchain-fingerprints" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA"
          tag=$(python3 -c 'import sys; sys.path.insert(0, "generator"); import gen; print(gen.image_tag(sys.argv[1]))' "$TC_ID")
          digest=$(docker image inspect --format '{{json .RepoDigests}}' "$tag" | python3 -c 'import json,sys; print([d for d in json.load(sys.stdin) if d.startswith(sys.argv[1] + "@")][0].split("@")[1])' "$TCFP_REGISTRY")
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.TCFP_REGISTRY }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      - name: Probe the pushed image
        run: python3 generator/gen.py probe "$TC_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: record-${{ matrix.tc_id }}
          path: .cache/records/${{ matrix.tc_id }}.json
          include-hidden-files: true
          if-no-files-found: error

  record:
    # Commit the new records to the PR branch. Uses the GitHub App token so the
    # push triggers CI again (a GITHUB_TOKEN push would not).
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app.outputs.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: record-*
          path: .cache/records
          merge-multiple: true
      - name: Merge records and commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          STALE: ${{ needs.plan.outputs.stale }}
        run: |
          export TCFP_REGISTRY="ghcr.io/${GITHUB_REPOSITORY,,}"
          python3 generator/gen.py merge
          python3 generator/gen.py status
          if git diff --quiet -- data/fingerprints.json; then echo "no data change"; exit 0; fi
          uid=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${uid}+${SLUG}[bot]@users.noreply.github.com"
          git add data/fingerprints.json
          git commit -m "Record fingerprints: $(python3 -c 'import json, os; print(", ".join(json.loads(os.environ["STALE"])))')"
          git push

  ready:
    # The one required check: passes only when every record matches its Dockerfile.
    # On a PR that needed probing it fails on the first commit; the record job's
    # push starts a new run on the new head, where it passes.
    needs: [checks, record]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Earlier jobs
        if: needs.checks.result != 'success' || (needs.record.result != 'success' && needs.record.result != 'skipped')
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Every record is current (and its image is in GHCR)
        run: |
          export TCFP_REGISTRY="ghcr.io/${GITHUB_REPOSITORY,,}"
          python3 generator/gen.py status || {
            echo "::error::Records are stale. On a PR from this repo, CI commits them; from a fork, run gen.py build/probe/merge locally."
            exit 1; }
