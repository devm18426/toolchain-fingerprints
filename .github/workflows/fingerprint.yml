name: fingerprint

# Fingerprints every toolchain under ./toolchains and publishes the dataset +
# the browsable table to GitHub Pages.
#
# Sourcing model: the TOOL only reads local extracted toolchains (./toolchains/*).
# This workflow's "provide toolchains" step is just CI plumbing that populates
# that dir from the URL list in toolchains.txt. Swap it for your own step (cache,
# artifact, committed dir) without touching the tool.

on:
  push: { branches: [main] }
  workflow_dispatch: {}
  schedule: [{ cron: "0 6 * * 1" }]   # weekly

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Provide toolchains (download + extract from toolchains.txt)
        run: |
          mkdir -p toolchains
          # each non-comment line: <name> <url>
          grep -vE '^\s*(#|$)' toolchains.txt | while read -r name url; do
            [ -d "toolchains/$name" ] && { echo "have $name"; continue; }
            echo "fetch $name <- $url"
            f="$(basename "$url")"
            curl -fsSL "$url" -o "/tmp/$f" || { echo "  download failed, skipping"; continue; }
            mkdir -p "toolchains/$name"
            case "$f" in
              *.tar.xz)  tar -xf "/tmp/$f" -C "toolchains/$name" --strip-components=1 ;;
              *.tar.bz2) tar -xf "/tmp/$f" -C "toolchains/$name" --strip-components=1 ;;
              *.tar.gz)  tar -xf "/tmp/$f" -C "toolchains/$name" --strip-components=1 ;;
              *) echo "  unknown archive type"; rmdir "toolchains/$name" ;;
            esac
          done

      - name: Fingerprint
        run: |
          chmod +x fingerprint-dir.sh probe-toolchain.sh
          # toolchains expose bin/ under their top dir; add each to PATH is unnecessary,
          # fingerprint-dir.sh finds the *-gcc directly.
          ./fingerprint-dir.sh ./toolchains > fingerprints.json
          echo "---"; cat fingerprints.json

      - name: Commit updated dataset
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- fingerprints.json; then
            git add fingerprints.json
            git commit -m "ci: refresh fingerprints.json"
            git push
          else
            echo "no dataset change"
          fi

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp fingerprints.json _site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.dep.outputs.page_url }}" }
    steps:
      - id: dep
        uses: actions/deploy-pages@v4
